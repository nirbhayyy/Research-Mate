[project]
name = "researchmate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nirbhayyy", email = "niiiiiir64@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-chroma>=1.2.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.3.0",
    "langchain-text-splitters>=1.2.0",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
]

[project.scripts]
researchmate = "researchmate:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
